# Yev Neon — mirrors nvim/colors/yev.lua (dark).
# Ink with a violet cast, Yev Signal (#FF4D1F) as the cursor and current match.

[colors.primary]
background = "#0F0E14"
foreground = "#E6E2F2"
bright_foreground = "#FBF8FF"
dim_foreground = "#A39CBF"

[colors.cursor]
text = "#0F0E14"
cursor = "#FF4D1F"

[colors.vi_mode_cursor]
text = "#0F0E14"
cursor = "#B392FF"

[colors.selection]
text = "CellForeground"
background = "#352A4D"

[colors.search.matches]
foreground = "#0F0E14"
background = "#B392FF"

[colors.search.focused_match]
foreground = "#0F0E14"
background = "#FF4D1F"

[colors.footer_bar]
foreground = "#0F0E14"
background = "#B392FF"

[colors.hints.start]
foreground = "#0F0E14"
background = "#FF4D1F"

[colors.hints.end]
foreground = "#0F0E14"
background = "#FFCB6B"

[colors.line_indicator]
foreground = "None"
background = "None"

