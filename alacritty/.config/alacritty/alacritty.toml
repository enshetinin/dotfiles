# Alacritty — Yev Neon
# Frosted glass window, JetBrains Mono Nerd Font, colors in colors/yev.toml.

[general]
import = ["~/.config/alacritty/colors/yev.toml"]
live_config_reload = true

[env]
COLORTERM = "truecolor"

[window]
opacity = 0.82
blur = true
decorations = "Buttonless"
option_as_alt = "OnlyLeft"
dynamic_padding = true
dimensions = { columns = 120, lines = 35 }
position = { x = 400, y = 250 }
padding = { x = 18, y = 14 }
# startup_mode = "Fullscreen"

[font]
size = 18.0
offset = { x = 0, y = 4 }          # a bit more line height
glyph_offset = { x = 0, y = 2 }    # keep glyphs centered in the taller line
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = { shape = "Underline", blinking = "Off" }
blink_interval = 550
blink_timeout = 10
unfocused_hollow = true
thickness = 0.18

[scrolling]
history = 50000
multiplier = 3

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration = 120
color = "#FF4D1F"

[keyboard]
bindings = [
    { key = "Return", mods = "Command", action = "ToggleFullscreen" },
    { key = "N", mods = "Command", action = "CreateNewWindow" },
]
